# First-boot seed only. The live config is /etc/heka/heka.yaml on a
# persistent volume; this file is copied there once, if and only if that
# path doesn't exist yet (see cmd/heka's -seed flag). After that, edit the
# live file directly or through the dashboard's config editor
# (/dashboard) — changes to this file in the repo have no effect on an
# already-deployed instance.

listen: "0.0.0.0:8787"

auth:
  tokens:
    - "${HEKA_TOKEN}"

rotation:
  cooldown_base: 60s
  cooldown_max: 1h
  max_retries: 3
  max_body_buffer: 10MiB

# history:
#   size: 500        # requests kept in the in-memory ring buffer
#   errors: 200
#   max_bytes: 32MiB  # captured-body memory budget across all kept requests
#
# dashboard:
#   enabled: true
#   config_edit: true
#   watch: 10s        # how often to notice out-of-band edits to this file

providers:
  opencode-go:
    base_url: https://opencode.ai/zen/go
    key_in:
      header: Authorization
      prefix: "Bearer "
    keys:
      - "${OPENCODE_GO_KEY_1}"
      - "${OPENCODE_GO_KEY_2}"
      - "${OPENCODE_GO_KEY_3}"
      - "${OPENCODE_GO_KEY_4}"
      - "${OPENCODE_GO_KEY_5}"
      - "${OPENCODE_GO_KEY_6}"
      - "${OPENCODE_GO_KEY_7}"
      - "${OPENCODE_GO_KEY_8}"
      - "${OPENCODE_GO_KEY_9}"
      - "${OPENCODE_GO_KEY_10}"
    rotation:
      max_retries: 9

  opencode-go-anthropic:
    base_url: https://opencode.ai/zen/go
    key_in:
      header: x-api-key
    keys:
      - "${OPENCODE_GO_KEY_1}"
      - "${OPENCODE_GO_KEY_2}"
      - "${OPENCODE_GO_KEY_3}"
      - "${OPENCODE_GO_KEY_4}"
      - "${OPENCODE_GO_KEY_5}"
      - "${OPENCODE_GO_KEY_6}"
      - "${OPENCODE_GO_KEY_7}"
      - "${OPENCODE_GO_KEY_8}"
      - "${OPENCODE_GO_KEY_9}"
      - "${OPENCODE_GO_KEY_10}"
    rotation:
      max_retries: 9

sidecar:
  cliproxy:
    route: oauth
    url: http://cliproxyapi:8317
    health_interval: 30s
    key_in:
      header: Authorization
      prefix: "Bearer "
    key: "${CLIPROXY_API_KEY}"
