listen: "0.0.0.0:8787"

auth:
  tokens:
    - "${HEKA_TOKEN}"

rotation:
  cooldown_base: 60s
  cooldown_max: 1h
  max_retries: 3
  max_body_buffer: 10MiB

providers:
  opencode-go:
    base_url: https://opencode.ai/zen/go
    key_in:
      header: Authorization
      prefix: "Bearer "
    keys:
      - "${OPENCODE_GO_KEY_1}"
      - "${OPENCODE_GO_KEY_2}"
      - "${OPENCODE_GO_KEY_3}"
      - "${OPENCODE_GO_KEY_4}"
      - "${OPENCODE_GO_KEY_5}"
      - "${OPENCODE_GO_KEY_6}"
      - "${OPENCODE_GO_KEY_7}"
      - "${OPENCODE_GO_KEY_8}"
      - "${OPENCODE_GO_KEY_9}"
      - "${OPENCODE_GO_KEY_10}"
    rotation:
      max_retries: 9

sidecar:
  cliproxy:
    route: oauth
    url: http://cliproxyapi:8317
    health_interval: 30s
    key_in:
      header: Authorization
      prefix: "Bearer "
    key: "${CLIPROXY_API_KEY}"
