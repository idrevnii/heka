x-logging: &default-logging
  driver: local
  options:
    max-size: "20m"
    max-file: "5"

services:
  heka:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      HEKA_TOKEN: "${SERVICE_PASSWORD_64_HEKA}"
      HEKA_USER: "${HEKA_USER:-admin}"
      # bcrypt hash of the dashboard password: docker compose run --rm heka -hash
      HEKA_PASSWORD_HASH: "${HEKA_PASSWORD_HASH}"
      CLIPROXY_API_KEY: "${SERVICE_PASSWORD_64_CLIPROXY}"
      COOLIFY_APP_NAME: heka
    ports:
      - "${HEKA_BIND_ADDRESS:-10.40.0.10}:${HEKA_PORT:-8787}:8787"
    volumes:
      - type: bind
        source: /data/apps/heka/config
        target: /etc/heka
    depends_on:
      heka-init:
        condition: service_completed_successfully
      cliproxyapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8787/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

  # One-shot: makes the config volume writable by heka's non-root uid.
  # read_only: true on the heka service doesn't affect bind mounts, but a
  # freshly created host directory would otherwise be root-owned and heka
  # (cap_drop: ALL, uid 65532) could neither seed nor save its config.
  heka-init:
    image: alpine:3.22
    user: "0:0"
    command: ["sh", "-ec", "mkdir -p /etc/heka && chown -R 65532:65532 /etc/heka && chmod 700 /etc/heka"]
    volumes:
      - type: bind
        source: /data/apps/heka/config
        target: /etc/heka
    restart: "no"

  cliproxyapi:
    image: eceasy/cli-proxy-api:v7.2.100
    restart: unless-stopped
    environment:
      TZ: Europe/Moscow
      COOLIFY_APP_NAME: cliproxyapi
    expose:
      - "8317"
    configs:
      - source: cliproxy-config
        target: /CLIProxyAPI/config.yaml
    volumes:
      - type: bind
        source: /data/apps/heka/cliproxy-auth
        target: /root/.cli-proxy-api
    healthcheck:
      test: ["CMD-SHELL", "/bin/bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8317'"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging

configs:
  cliproxy-config:
    content: |
      host: "0.0.0.0"
      port: 8317

      remote-management:
        allow-remote: false
        secret-key: ""
        disable-control-panel: true
        disable-auto-update-panel: true

      auth-dir: "/root/.cli-proxy-api"

      api-keys:
        - "${SERVICE_PASSWORD_64_CLIPROXY}"

      debug: false
      request-log: false
      logging-to-file: false
      usage-statistics-enabled: false

      request-retry: 3
      routing:
        strategy: round-robin

      streaming:
        keepalive-seconds: 15
        bootstrap-retries: 1
